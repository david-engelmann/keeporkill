[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tameshi"
version = "0.1.0"
description = "The evidence pack tool for checks, assembling evidence packs and issuing rulings as pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
tameshi = "tameshi.cli:main"

[tool.setuptools.packages.find]
include = ["tameshi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
